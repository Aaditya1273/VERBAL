name: verbal
description: "VERBAL - Practice difficult conversations before you have them."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management (single paradigm: Riverpod)
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  http: ^1.2.2

  # Persistence
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Voice pipeline
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  # Monetization
  purchases_flutter: ^8.4.0

  # Glyphs used by Material's adaptive widgets (dialogs, switches on iOS).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
