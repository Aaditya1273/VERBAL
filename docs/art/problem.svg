<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="lamp" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#3A3A40"/><stop offset="1" stop-color="#09090B"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202024"/><stop offset="1" stop-color="#141416"/></linearGradient>
  <linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9B9BA4"/></marker>
</defs>
<rect width="1200" height="380" rx="28" fill="#09090B"/><rect width="1200" height="380" rx="28" fill="url(#lamp)"/>
<text x="60" y="70" fill="#9B9BA4" font-size="13" font-weight="600" letter-spacing="2" text-anchor="start">THE PROBLEM</text><rect x="60" y="100" width="340" height="230" rx="24" fill="url(#card)" stroke="#2E2E33"/><rect x="88" y="100" width="284" height="1" fill="url(#hair)"/><text x="96" y="170" font-size="44">😶</text><text x="96" y="230" fill="#F5F5F7" font-size="26" font-weight="600">No rehearsal</text><text x="96" y="268" fill="#9B9BA4" font-size="18">You get one shot,</text><text x="96" y="294" fill="#9B9BA4" font-size="18">with real stakes.</text><rect x="430" y="100" width="340" height="230" rx="24" fill="url(#card)" stroke="#2E2E33"/><rect x="458" y="100" width="284" height="1" fill="url(#hair)"/><text x="466" y="170" font-size="44">📄</text><text x="466" y="230" fill="#F5F5F7" font-size="26" font-weight="600">Advice is text</text><text x="466" y="268" fill="#9B9BA4" font-size="18">Reading a script is</text><text x="466" y="294" fill="#9B9BA4" font-size="18">not saying it out loud.</text><rect x="800" y="100" width="340" height="230" rx="24" fill="url(#card)" stroke="#2E2E33"/><rect x="828" y="100" width="284" height="1" fill="url(#hair)"/><text x="836" y="170" font-size="44">🤖</text><text x="836" y="230" fill="#F5F5F7" font-size="26" font-weight="600">Chatbots agree</text><text x="836" y="268" fill="#9B9BA4" font-size="18">They fold the moment</text><text x="836" y="294" fill="#9B9BA4" font-size="18">you push. People don't.</text>
</svg>