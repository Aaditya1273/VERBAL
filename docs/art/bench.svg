<text x="60" y="60" fill="#9B9BA4" font-size="13" font-weight="600" letter-spacing="2" text-anchor="start">VERBAL PITFALL BENCH · 23 PAIRED ITEMS · LIVE MODEL</text><text x="60" y="138" fill="#F5F5F7" font-size="20">Detects the pitfall</text><rect x="440" y="118" width="600" height="28" rx="14" fill="#1D1D21"/><rect x="440" y="118" width="468" height="28" rx="14" fill="#F5F5F7"/><text x="1060" y="140" fill="#F5F5F7" font-size="22" font-weight="600">78%</text><text x="60" y="218" fill="#F5F5F7" font-size="20">Stays quiet when there is none</text><rect x="440" y="198" width="600" height="28" rx="14" fill="#1D1D21"/><rect x="440" y="198" width="522" height="28" rx="14" fill="#F5F5F7"/><text x="1060" y="220" fill="#F5F5F7" font-size="22" font-weight="600">87%</text><text x="60" y="298" fill="#F5F5F7" font-size="20">Reacts as instructed, unaided</text><rect x="440" y="278" width="600" height="28" rx="14" fill="#1D1D21"/><rect x="440" y="278" width="210" height="28" rx="14" fill="#9B9BA4"/><text x="1060" y="300" fill="#F5F5F7" font-size="22" font-weight="600">35%</text><text x="60" y="380" fill="#9B9BA4" font-size="17">35% is why the engine, not the model, decides when to push back. Reproduce: dart run tool/pitfall_bench.dart</text>
